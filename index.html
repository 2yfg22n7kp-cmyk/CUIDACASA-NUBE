  --phone:#05090A; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{

/* ---------- utilidades ---------- */
function now(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g=t=>(p.find(x=>x.type===t)||{}).value;
  return {fecha:g('year')+'-'+g('month')+'-'+g('day'),min:(+g('hour'))*60+(+g('minute'))};
}
const hhmm=t=>{t=Math.max(0,Math.round(t));return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0');};
const parseHH=s=>{const m=String(s).trim().match(/^(\d{1,2})(?:[:.](\d{2}))?$/);if(!m)return null;const h=+m[1],mi=+(m[2]||0);if(h>24||mi>59||(h===24&&mi>0))return null;return h*60+mi;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fechaTxt=f=>{const[a,m,d]=f.split('-');return d+'/'+m+'/'+a;};
let toastT=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2800);}
function errMsg(e){
  const c=e&&e.code;
  if(c==='permission-denied') return 'No tenés permiso para guardar esto. Pedile a la coordinación que revise tu acceso.';
  if(c==='unavailable') return 'Sin conexión. Revisá internet y probá de nuevo.';
  if(c==='invalid_argument') return 'Tu acceso a esta página es solo para ver, así que no se puede guardar. La coordinación tiene que invitarte por email con permiso de edición.';
  if(c==='quota_exceeded') return 'Se llenó el espacio de datos de la app. Avisale a la coordinación.';
  if(c==='resource_exhausted') return 'Demasiados cambios seguidos. Esperá unos segundos y probá de nuevo.';
  return 'No se pudo guardar. Revisá la conexión y probá de nuevo.';
}
const queues={};
function qWrite(key,fn){const p=(queues[key]||Promise.resolve()).then(fn,fn);queues[key]=p.catch(()=>{});return p;}
async function safe(fn,okMsg){try{await fn();if(okMsg)toast(okMsg);return true;}catch(e){toast(errMsg(e));return false;}}

/* ---------- roles ---------- */
function rol(){
  who=me; if(!me) return null;
  if((S.equipo.admins||[]).includes(me)) return 'coordinacion';
  const m=(S.equipo.miembros||{})[me]; return m&&m.rol&&m.rol!=='coordinacion'?m.rol:null;
}
const activos=()=>Object.keys(S.pacientes).filter(pid=>S.pacientes[pid].activo!==false).sort((a,b)=>String(S.pacientes[a].nombre).localeCompare(S.pacientes[b].nombre));
function misPacientes(){
  const r=rol(); if(r==='coordinacion') return activos();
  const m=S.equipo.miembros[who]; return ((m&&m.pacientes)||[]).filter(pid=>S.pacientes[pid]&&S.pacientes[pid].activo!==false);
}
function personasDe(pid,r){return Object.keys(S.equipo.miembros||{}).filter(u=>{const m=S.equipo.miembros[u];return m.rol===r&&(m.pacientes||[]).includes(pid);});}
function nombre(uid){const m=(S.equipo.miembros||{})[uid];if(m&&m.nombre)return m.nombre;if(uid==='owner'||(S.equipo.admins||[]).includes(uid)){const ai=(S.equipo.adminInfo||{})[uid];return (ai&&ai.nombre)||'Coordinación';}const p=S.names[uid];return (p&&p.name)||'Alguien del equipo';}
let namesBusy=false;
async function ensureNames(ids){
  if(!user||namesBusy) return; ids=[...new Set(ids.filter(Boolean))].filter(id=>!(id in S.names)); if(!ids.length) return;
  namesBusy=true; try{const ps=await user.profiles(ids);Object.assign(S.names,ps);}catch(e){} namesBusy=false; render();
}

/* ---------- lógica del cuidado ---------- */
function tareas(pid){
  const p=S.pacientes[pid],out=[]; if(!p) return out;
  const t0=p.turno[0],t1=p.turno[1];
  (p.plan||[]).forEach(it=>{
    let hs=[];
    if(it.horas&&it.horas.length) hs=it.horas.slice();
    else if(it.cada>0){for(let t=(it.desde!=null?it.desde:t0+30);t<t1;t+=it.cada*60) hs.push(t);}
    hs.filter(t=>t>=t0&&t<t1).forEach(t=>out.push({key:it.id+'@'+t,it,t}));
  });
  return out.sort((a,b)=>a.t-b.t);
}
const dia=pid=>S.dias[pid]||{};
const regs=pid=>Object.values(dia(pid).reg||{}).sort((a,b)=>a.t-b.t);
const regDe=(pid,key)=>regs(pid).find(r=>r.key===key);
function estado(pid,tk,c){
  const r=regDe(pid,tk.key);
  if(r) return Math.abs(r.t-tk.t)<=30?'hecha':'tarde';
  if(c<tk.t-30) return 'proxima';
  if(c<=tk.t+30) return 'ahora';
  return 'omitida';
}
function cumplimiento(pid,c){let prog=0,ok=0;tareas(pid).forEach(tk=>{const e=estado(pid,tk,c);if(e==='proxima'||e==='ahora')return;prog++;if(e==='hecha')ok++;});return {prog,ok,p:pct(ok,prog)};}
const liquidos=pid=>regs(pid).filter(r=>r.tipo==='hidratacion').reduce((s,r)=>s+((r.d&&r.d.ml)||0),0);
const metaLiq=pid=>{const it=((S.pacientes[pid]||{}).plan||[]).find(i=>i.tipo==='hidratacion');return it?(it.meta||0):0;};
function ultimoPostural(pid){const rs=regs(pid).filter(r=>r.tipo==='postural').map(r=>r.t);const ci=dia(pid).checkin;if(!rs.length) return ci?ci.t:null;return Math.max.apply(null,rs.concat(ci?[ci.t]:[]));}
const novs=pid=>Object.keys(dia(pid).nov||{}).map(id=>Object.assign({id},dia(pid).nov[id])).sort((a,b)=>a.t-b.t);
function alertas(c){
  const out=[];
  activos().forEach(pid=>{
    const p=S.pacientes[pid],d=dia(pid),ci=d.checkin,cuid=personasDe(pid,'cuidadora').map(nombre).join(', ')||'La cuidadora';
    novs(pid).forEach(n=>{
      if(n.caida) out.push({id:'nov-'+n.id,pid,sev:'crit',t:n.t,t1:'Caída reportada',t2:'“'+n.txt+'”'});
      else if(ALARMA.test(n.txt)) out.push({id:'nov-'+n.id,pid,sev:'warn',t:n.t,t1:'Señal de alarma en una novedad',t2:'“'+n.txt+'”'});
    });
    if(c<p.turno[0]) return;
    if(!ci){ if(c>p.turno[0]+15) out.push({id:'sinllegada-'+pid,pid,sev:'crit',t:p.turno[0]+15,t1:'Sin llegada registrada',t2:cuid+' debía llegar a las '+hhmm(p.turno[0])+'.'}); return; }
    if(ci.t-p.turno[0]>10) out.push({id:'tarde-'+pid,pid,sev:'info',t:ci.t,t1:'Llegada tardía',t2:(ci.t-p.turno[0])+' min tarde ('+hhmm(ci.t)+').'});
    if(d.checkout) return;
    if((p.plan||[]).some(i=>i.tipo==='postural')){const u=ultimoPostural(pid);if(u!==null&&c-u>150) out.push({id:'postural-'+pid+'-'+u,pid,sev:'crit',t:u+150,t1:'Más de 2 h 30 min sin cambio de posición',t2:'Último registro: '+hhmm(u)+(p.val&&p.val.braden?' · Braden '+p.val.braden:'')+'.'});}
    const meta=metaLiq(pid);
    if(meta){const fr=Math.min(1,(c-p.turno[0])/(p.turno[1]-p.turno[0])),esp=meta*fr,tot=liquidos(pid);
      if(fr>0.25&&tot<0.7*esp) out.push({id:'hid-'+pid+'-'+Math.floor(c/120),pid,sev:'warn',t:c,t1:'Hidratación por debajo del objetivo',t2:tot+' ml registrados; a esta hora se esperaban unos '+Math.round(esp/50)*50+' ml (meta: '+meta+' ml).'});}
    tareas(pid).forEach(tk=>{if(tk.it.tipo==='postural'||tk.it.tipo==='hidratacion')return;if(estado(pid,tk,c)==='omitida') out.push({id:'omit-'+pid+'-'+tk.key,pid,sev:tk.it.tipo==='medicacion'?'crit':'warn',t:tk.t+30,t1:TIPOS[tk.it.tipo].n+' de las '+hhmm(tk.t)+' sin registrar',t2:tk.it.obj});});
  });
  const ack=id=>{const pid=(out.find(a=>a.id===id)||{}).pid;return pid&&dia(pid).ack&&dia(pid).ack[id];};
  const rank={crit:0,warn:1,info:2};
  out.forEach(a=>{a.ack=ack(a.id)||null;});
  return out.sort((a,b)=>(!!a.ack)-(!!b.ack)||rank[a.sev]-rank[b.sev]||a.t-b.t);
}
function describe(r){
  const d=r.d||{};
  switch(r.tipo){
    case 'hidratacion': return d.ml?('Tomó '+d.ml+' ml de líquido'):'Rechazó el líquido ofrecido';
    case 'alimentacion': return 'Comió '+d.pct+'% de la comida';
    case 'postural': return 'Cambio de posición: '+String(d.pos||'').toLowerCase();
    case 'medicacion': return 'Medicación: '+String(d.est||'').toLowerCase();
    case 'higiene': return 'Higiene: '+(d.acc||[]).join(', ').toLowerCase()+(d.piel?(' · piel '+d.piel.toLowerCase()):'');
  }
  return '';
}

/* ---------- escritura ---------- */
function writeDia(pid,patch){
  const fecha=S.fecha,ref=db.doc('dias/'+pid+'_'+fecha);
  return qWrite('dia-'+pid,async()=>{
    if(S.dias[pid]) return ref.update(patch);
    const s=await ref.get();
    if(s.exists) return ref.update(patch);
    return ref.set(Object.assign({pid,fecha},patch));
  });
}
const writePac=(pid,patch)=>qWrite('pac-'+pid,()=>db.doc('pacientes/'+pid).update(patch));
const writeEquipo=body=>qWrite('equipo',()=>db.doc('config/equipo').set(Object.assign({admins:S.equipo.admins||[],adminInfo:S.equipo.adminInfo||{}},body)));

function tabsFor(r){
  if(r==='coordinacion') return [['tablero','Supervisión'],['plan','Pacientes y planes'],['guia','Guía de valoración'],['equipo','Equipo'],['cuidadora','Vista cuidadora'],['familia','Vista familia']];
  if(r==='cuidadora') return [['cuidadora','Mi turno']];
  if(r==='familia') return [['familia','Portal familiar']];
  return [];
}
function renderTop(r){
  const tabs=tabsFor(r);
  if(!ui.view||!tabs.some(t=>t[0]===ui.view)) ui.view=tabs.length?tabs[0][0]:null;
  const meP=who&&!String(who).startsWith('c-')?S.names[who]:null,byCode=who&&String(who).startsWith('c-');
  const nm=nombre(who);
  document.getElementById('top').innerHTML='<div class="brand"><b>CuidaCasa</b><span>Cuidado trazable</span></div>'+

    (r?'<div class="who">'+(meP?'<img alt="" src="'+esc(meP.avatarUrl)+'">':'')+'<span><b>'+esc(nm)+'</b> · '+ROLES[r]+'</span>'+'<button class="btn ghost" data-act="signout">Salir</button>'+'</div>':'');
}
function captureFocus(){const a=document.activeElement;if(!a||!a.id)return null;return {id:a.id,s:a.selectionStart,e:a.selectionEnd};}
function restoreFocus(f){if(!f)return;const el=document.getElementById(f.id);if(!el)return;el.focus();try{if(f.s!=null)el.setSelectionRange(f.s,f.e);}catch(e){}}
const draft=(id,def)=>id in ui.drafts?ui.drafts[id]:(def||'');
function render(){
  const f=captureFocus();
  if(ui.fatal){renderTop(null);app.innerHTML=fatal();return;}
  if(ui.auth==='wait') return;
  if(ui.auth==='login'){renderTop(null);app.innerHTML=vLogin();renderSheet();restoreFocus(f);return;}
  if(ui.noAccess){renderTop(null);app.innerHTML=vSolicitud();restoreFocus(f);return;}
  if(!S.loaded.e||!S.loaded.p){return;}
  const r=rol(); renderTop(r);
  let h;
  if(!r) h=vSolicitud();
  else h=({tablero:vTablero,plan:vPlan,guia:vGuia,equipo:vEquipo,cuidadora:vCuid,familia:vFamilia}[ui.view]||vTablero)();
  app.innerHTML=h;
  renderSheet();
  restoreFocus(f);
  const ids=Object.keys(S.equipo.miembros||{}).concat(S.solicitudes.map(s=>s.id),me?[me]:[]);
  ensureNames(ids);
}
function fatal(){
  if(ui.fatal==='timeout'||String(ui.fatal).startsWith('fb:')){
    const c=ui.fatal==='timeout'?'sin respuesta':ui.fatal.slice(3);
    const tip=c==='permission-denied'?'Las reglas de seguridad no permiten el acceso. Revisá que hayas pegado y publicado las reglas en Firestore → Reglas.'
      :(c==='not-found'||c==='failed-precondition')?'La base de datos de Firestore no está creada. En Firebase entrá a Firestore Database y tocá “Crear base de datos”.'
      :c==='sin respuesta'?'La app no logra conectarse con Firestore. Revisá que la base de datos esté creada y que no haya un bloqueador de anuncios o una red que bloquee Google.'
      :'Revisá en Firebase que la base de Firestore esté creada y que las reglas estén publicadas.';
    return '<div class="panel center"><p class="eyebrow">No se pudo conectar</p><h2>La app no puede leer la base de datos</h2><p>'+esc(tip)+'</p><p class="note">Código: '+esc(c)+'</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="reload">Reintentar</button><button class="btn ghost" data-act="signout">Salir</button></div></div>';
  }
  if(ui.fatal==='nodb') return '<div class="panel center"><h2>No se pudo abrir la app</h2><p>No se pudo cargar la app. Revisá la conexión a internet y recargá la página.</p></div>';
  return '<div class="panel center"><h2>Se perdió el acceso</h2><p>Tu acceso a esta página cambió. Volvé a abrir el enlace o pedile acceso a la coordinación.</p></div>';
}
function selector(list,cur,attr){
  if(list.length<2) return '';
  return '<div class="seg">'+list.map(pid=>'<button data-'+attr+'="'+pid+'" aria-pressed="'+(pid===cur)+'">'+esc(S.pacientes[pid].nombre)+'</button>').join('')+'</div>';
}
function curPid(){const l=misPacientes();if(!l.length)return null;if(!ui.pid||!l.includes(ui.pid))ui.pid=l[0];return ui.pid;}

function authMsg(c){
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials') return 'Email o contraseña incorrectos.';
  if(c==='auth/email-already-in-use') return 'Ese email ya tiene usuario. Si es tuyo, ingresá con tu contraseña.';
  if(c==='auth/weak-password') return 'La contraseña tiene que tener al menos 6 caracteres.';
  if(c==='auth/invalid-email') return 'Revisá el email.';
  if(c==='auth/too-many-requests') return 'Demasiados intentos. Esperá unos minutos.';
  if(c==='auth/network-request-failed') return 'Sin conexión. Revisá internet.';
  if(c==='auth/operation-not-allowed') return 'Falta activar el acceso con correo y contraseña en Firebase.';
  return 'No se pudo completar. Probá de nuevo.';
}

/* Cuidadora */
function vCuid(){
  const pid=curPid(), c=now().min;
  if(!pid) return '<div class="panel center"><h2>Todavía no tenés pacientes asignados</h2><p>La coordinación te va a asignar el domicilio donde trabajás.</p></div>';
  const p=S.pacientes[pid],d=dia(pid),ci=d.checkin,co=d.checkout,coord=rol()==='coordinacion';
  const head='<div class="view-head"><div><h1>'+(coord?'Vista de la cuidadora':'Mi turno')+'</h1><p>'+fechaTxt(S.fecha)+' · turno '+hhmm(p.turno[0])+' a '+hhmm(p.turno[1])+'. Cada registro guarda la hora automáticamente.</p></div>'+selector(misPacientes(),pid,'pid')+'</div>';
  let body='';
  if(!ci){

  }

  const dock='<div class="dock-space"></div><div class="dock"><div class="dock-in">'+((ci&&!co)?sos.replace('Llamar 911','911')+'<button class="btn" data-act="nov">Novedad</button><button class="btn crit" data-act="caida">Reportar caída</button><button class="btn" data-act="out">Cerrar turno</button>':sos)+'</div></div>';

}

const ESCALAS={

function escalaScore(key,ans){const E=ESCALAS[key];let s=0;for(const it of E.items){const a=ans[it.id];if(a===undefined)return null;if(it.multi)a.forEach(i=>{s+=it.o[i][0];});else s+=it.o[a][0];}return s;}
const downtonTxt=v=>v>=3?'Riesgo alto de caídas':'Riesgo bajo de caídas';
const mnaTxt=v=>v>=12?'Estado nutricional normal':v>=8?'Riesgo de malnutrición':'Malnutrición';
const escalaTxt=(k,v)=>({barthel:barthelTxt,braden:x=>bradenTxt(x)+' de úlcera por presión',downton:downtonTxt,mna:mnaTxt})[k](v);
const escalaCls=(k,v)=>({barthel:v<=35?'crit':v<=55?'warn':'good',braden:v<=14?'crit':v<=18?'warn':'good',downton:v>=3?'warn':'good',mna:v<=7?'crit':v<=11?'warn':'good'})[k];
function nivel(v){
  v=v||{}; if(v.barthel==null&&v.braden==null) return null;
  const r=[];
  if(v.barthel!=null&&v.barthel<=35) r.push('Barthel '+v.barthel); if(v.braden!=null&&v.braden<=14) r.push('Braden '+v.braden); if(v.nutricion==='Desnutrición') r.push('malnutrición');
  if(r.length) return {n:'C',t:'Nivel C · alta complejidad',cls:'crit',r};
  if(v.barthel!=null&&v.barthel<=55) r.push('Barthel '+v.barthel); if(v.braden!=null&&v.braden<=18) r.push('Braden '+v.braden); if(v.caidas==='Alto') r.push('riesgo alto de caídas'); if(v.nutricion==='En riesgo') r.push('riesgo nutricional');
  if(r.length) return {n:'B',t:'Nivel B · complejidad moderada',cls:'warn',r};
  return {n:'A',t:'Nivel A · baja complejidad',cls:'good',r:['sin criterios de mayor complejidad']};
}
const VISITAS={A:'1 visita de supervisión por mes',B:'1 visita cada 15 días',C:'1 visita por semana'};
function diasDesde(f){if(!f)return null;return Math.round((Date.parse(S.fecha)-Date.parse(f))/864e5);}
function recomendaciones(p){
  const v=p.val||{},plan=p.plan||[],tiene=t=>plan.some(i=>i.tipo===t),out=[];
  if(v.braden!=null&&v.braden<=18) out.push({txt:'Cambios de posición cada 2 h'+(v.braden<=12?', superficie de alivio de presión (colchón de aire) y control de piel en cada higiene':' y control de piel diario')+'.',tipo:tiene('postural')?null:'postural'});
  if(v.barthel!=null&&v.barthel<=35) out.push({txt:'Asistencia total en las actividades diarias: higiene en cama al menos 2 veces por turno y alimentación asistida.',tipo:tiene('higiene')?null:'higiene'});
  else if(v.barthel!=null&&v.barthel<=55) out.push({txt:'Supervisión y ayuda parcial en higiene, vestido y traslados.',tipo:null});
  if(v.barthel!=null&&v.barthel<=55) out.push({txt:'Ofrecer líquidos cada 2 h y registrar lo que toma.',tipo:tiene('hidratacion')?null:'hidratacion'});
  if(v.caidas==='Alto') out.push({txt:'Prevención de caídas: acompañar siempre al caminar y al ir al baño, retirar alfombras, luz nocturna, calzado cerrado y timbre o celular a mano.',tipo:null});
  if(v.nutricion==='En riesgo'||v.nutricion==='Desnutrición') out.push({txt:'Registrar el porcentaje de ingesta en cada comida y pesar una vez por mes'+(v.nutricion==='Desnutrición'?'; interconsulta con nutrición y médico de cabecera':'')+'.',tipo:tiene('alimentacion')?null:'alimentacion'});
  const d=diasDesde(v.fecha);
  if(d!=null&&d>90) out.push({txt:'La última valoración tiene '+d+' días: corresponde revalorar.',tipo:null,warn:true});
  return out;
}
function planDesdeValoracion(p){
  const v=p.val||{},t0=p.turno[0],t1=p.turno[1],en=hs=>hs.filter(h=>h>=t0&&h<t1);
  const b=v.barthel,br=v.braden,caidas=v.caidas==='Alto',nut=v.nutricion,dep=b!=null&&b<=55,total=b!=null&&b<=35;
  const prev=p.plan||[],meds=prev.filter(i=>i.tipo==='medicacion'),prevMeta=(prev.find(i=>i.tipo==='hidratacion')||{}).meta;
  const plan=[];
  if((br!=null&&br<=18)||total) plan.push({id:'pos',tipo:'postural',cada:2,desde:t0+30,obj:'Rotar: lateral izq. → supino → lateral der.'+(br!=null&&br<=12?' Usar colchón de aire y revisar sacro y talones.':'')});
  plan.push({id:'hid',tipo:'hidratacion',cada:dep?2:3,desde:t0+30,obj:dep?'Ofrecer 200 ml y ayudar a tomar':'Recordar y ofrecer líquidos',meta:prevMeta||1200});
  const riesgoNut=nut==='En riesgo'||nut==='Desnutrición',comidas=en(riesgoNut?[540,780,990,1110]:[540,780,1110]);
  if(comidas.length) plan.push({id:'ali',tipo:'alimentacion',horas:comidas,obj:(total?'Alimentación asistida':dep?'Ayudar y supervisar la comida':'Supervisar la comida')+(riesgoNut?'. Registrar % de ingesta; a las 16:30 ofrecer colación':'')+(nut==='Desnutrición'?'. Avisar a la coordinación si come menos de la mitad':'')});
  let hig=en(br!=null&&br<=12?[600,840,1080]:total?[600,1080]:[600]); if(!hig.length) hig=[t0+60];
  plan.push({id:'hig',tipo:'higiene',horas:hig,obj:(total?'Higiene en cama, cambio de pañal y control de piel':dep?'Ayuda en higiene y control de piel':'Supervisar la higiene y controlar la piel')+(caidas?'. Acompañar siempre al baño (riesgo de caídas)':'')});
  if(meds.length) meds.forEach(m=>plan.push(m)); else plan.push({id:'med',tipo:'medicacion',horas:en([540]).length?[540]:[t0+60],obj:'Indicar fármaco y dosis'});
  return plan;
}

/* Familia */
function vFamilia(){

  const rs=regs(pid),com=rs.filter(r=>r.tipo==='alimentacion'),pos=rs.filter(r=>r.tipo==='postural'),med=rs.filter(r=>r.tipo==='medicacion');

  h+='<div class="fam"><div class="stack"><section class="panel"><div class="panel-h"><h2>Hoy</h2>'+(ci?'<span class="chip good">'+esc(nombre(ci.by))+' llegó a las '+hhmm(ci.t)+'</span>':'<span class="chip warn">Todavía no se registró la llegada</span>')+'</div>'+
    '<div class="fam-sum"><div><div class="v num">'+liquidos(pid)+' ml</div><div class="l">líquidos'+(meta?' de '+meta+' ml':'')+'</div></div><div><div class="v num">'+(com.length?com.map(r=>r.d.pct+'%').join(' · '):'—')+'</div><div class="l">de cada comida</div></div>'+
    '<div><div class="v num">'+pos.length+'</div><div class="l">cambios de posición'+(pos.length?' · último '+hhmm(pos[pos.length-1].t):'')+'</div></div><div><div class="v num">'+med.filter(r=>r.d.est==='Administrada').length+'/'+medProg+'</div><div class="l">tomas de medicación</div></div></div></section>';
  const ev=[];
  if(ci) ev.push({t:ci.t,txt:'Llegada de '+nombre(ci.by)+' (verificada en el domicilio)',c:''});
  rs.forEach(r=>ev.push({t:r.t,txt:describe(r),c:(r.tipo==='alimentacion'&&r.d.pct<50)||(r.tipo==='medicacion'&&r.d.est!=='Administrada')?'w':''}));
  let enRev=0;
  novs(pid).forEach(n=>{const alarm=n.caida||ALARMA.test(n.txt),rev=d.ack&&d.ack['nov-'+n.id];if(alarm&&!rev){enRev++;return;}ev.push({t:n.t,txt:(n.caida?'Caída: ':'Novedad: ')+n.txt+(alarm?' · revisada por la coordinación':''),c:n.caida?'c':alarm?'w':''});});
  if(d.checkout) ev.push({t:d.checkout.t,txt:'Salida de '+nombre(d.checkout.by),c:''});
  ev.sort((a,b)=>a.t-b.t);
  h+='<section class="panel"><div class="panel-h"><h2>Registro del día</h2>'+(enRev?'<span class="chip info">'+enRev+' novedad en revisión</span>':'')+'</div>'+(ev.length?'<ul class="tl">'+ev.map(e=>'<li><span class="h num">'+hhmm(e.t)+'</span><span class="dot '+e.c+'"></span><span>'+esc(e.txt)+'</span></li>').join('')+'</ul>':'<div class="empty">Todavía no hay registros hoy.</div>')+'</section></div>';
  const mias=S.consultas.filter(q=>q.pid===pid);
  h+='<aside class="panel"><div class="panel-h"><h2>Consultas</h2></div><div class="form"><label class="eyebrow" for="consulta">Escribile a la coordinación</label><textarea id="consulta" placeholder="Ej.: ¿Pueden avisarme cuando venga el médico de cabecera?">'+esc(draft('consulta'))+'</textarea><button class="btn primary" data-act="consulta" style="padding:10px">Enviar consulta</button>'+
    (mias.length?mias.slice(0,20).map(q=>'<div style="border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px"><div class="note num">'+fechaTxt(q.fecha)+' '+hhmm(q.t)+' · '+esc(nombre(q.by))+'</div><div>'+esc(q.txt)+'</div>'+(q.resp?'<div class="reply"><b>Respuesta:</b> '+esc(q.resp.txt)+'</div>':'<div><span class="chip info">Recibida por la coordinación</span></div>')+'</div>').join(''):'<p class="note" style="margin:0">Las consultas quedan registradas con su hora.</p>')+'</div></aside></div>';
  return h;
}

document.addEventListener('input',e=>{const t=e.target;if(t.id&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&!t.dataset.pi&&!t.dataset.val&&!t.dataset.pd&&t.type!=='checkbox')))ui.drafts[t.id]=t.value;});

});
document.addEventListener('change',async e=>{
  const t=e.target,d=t.dataset,pid=ui.planPid,p=S.pacientes[pid]; if(!p) return;
  if(d.val){const val=Object.assign({},p.val||{});if(d.val==='barthel'||d.val==='braden'){if(t.value===''){delete val[d.val];}else{const n=Math.round(+t.value);val[d.val]=Math.max(+t.min,Math.min(+t.max,isFinite(n)?n:+t.min));}}else val[d.val]=t.value;await safe(()=>writePac(pid,{val}));return;}
  if(d.pd){
    if(d.pd==='t0'||d.pd==='t1'){const v=parseHH(t.value),tr=p.turno.slice();if(v==null){toast('Usá el formato 08:00.');render();return;}tr[d.pd==='t0'?0:1]=v;if(tr[1]<=tr[0]){toast('El turno tiene que terminar después de empezar.');render();return;}await safe(()=>writePac(pid,{turno:tr}));return;}
    const v=d.pd==='edad'?(+t.value||null):t.value.trim(); if(d.pd==='nombre'&&!v){toast('El nombre no puede quedar vacío.');render();return;}
    await safe(()=>writePac(pid,{[d.pd]:v}));return;
  }
  if(d.pi!==undefined){
    const plan=JSON.parse(JSON.stringify(p.plan||[])),it=plan[+d.pi]; if(!it) return;
    if(d.pf==='modo'){if(t.value==='horas'){it.horas=[it.desde!=null?it.desde:p.turno[0]+30];}else{delete it.horas;it.cada=it.cada||2;it.desde=it.desde!=null?it.desde:p.turno[0]+30;}}
    if(d.pf==='cada') it.cada=Math.max(1,Math.min(8,+t.value||2));
    if(d.pf==='desde'){const v=parseHH(t.value);if(v==null){toast('Usá el formato 08:30.');render();return;}it.desde=v;}
    if(d.pf==='horas'){const hs=t.value.split(/[,;\s]+/).map(parseHH).filter(v=>v!=null);if(!hs.length){toast('Escribí horarios como 09:00, 13:00.');render();return;}it.horas=[...new Set(hs)].sort((a,b)=>a-b);}
    if(d.pf==='obj') it.obj=t.value.slice(0,200);
    if(d.pf==='meta') it.meta=Math.max(0,+t.value||0);
    await safe(()=>writePac(pid,{plan}));
  }
});

/* ---------- ingreso por QR (#ingreso-<paciente>-<código>) ---------- */
function readHash(){const m=(location.hash||'').match(/^#ingreso-([a-z0-9]+)-(\d{4})$/);if(m)ui.hashIntent={pid:m[1],code:m[2]};}
window.addEventListener('hashchange',()=>{readHash();handleIntent();});
let intentBusy=false;
async function handleIntent(){
  const it=ui.hashIntent; if(!it||intentBusy||!S.loaded.p||!S.loaded.e||!S.loaded.d) return;
  const p=S.pacientes[it.pid],r=rol();
  if(!p||!r) return;
  ui.hashIntent=null; try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(String(p.codigo)!==it.code){toast('Este QR ya no es válido. Pedile a la coordinación el código nuevo.');return;}
  if(!misPacientes().includes(it.pid)){toast('Este domicilio no está asignado a tu usuario.');return;}
  ui.pid=it.pid;ui.view=r==='coordinacion'?'cuidadora':ui.view;
  const d=dia(it.pid);
  intentBusy=true;
  if(!d.checkin) await safe(()=>writeDia(it.pid,{checkin:{t:now().min,by:who,qr:true}}),'Ingreso verificado con el QR a las '+hhmm(now().min));
  else if(!d.checkout){ui.sheet={kind:'confirm',pid:it.pid,title:'¿Registrar tu salida?',text:'Ya registraste el ingreso a las '+hhmm(d.checkin.t)+'. Si te vas, se cierra el turno a las '+hhmm(now().min)+'.',ok:'Registrar salida',run:()=>writeDia(it.pid,{checkout:{t:now().min,by:who}}),msg:'Salida registrada'};}
  else toast('El turno de hoy ya está cerrado.');
  intentBusy=false; render();
}

/* ---------- datos en vivo ---------- */
const unsub={};let auth=null;
function wrapRef(r){return {id:r.id,path:r.path,get:()=>r.get(),set:d=>r.set(d),update:d=>r.set(d,{merge:true}),delete:()=>r.delete(),onSnapshot:(n,e)=>r.onSnapshot(n,e)};}
function wrapDb(f){return {doc:p=>wrapRef(f.doc(p)),collection:c=>{const col=f.collection(c);return {where:(...a)=>col.where(...a),orderBy:(...a)=>col.orderBy(...a),limit:n=>col.limit(n),onSnapshot:(n,e)=>col.onSnapshot(n,e),get:()=>col.get(),doc:id=>wrapRef(id?col.doc(id):col.doc())};}};}
function saveFile(filename,data,type){const blob=data instanceof Blob?data:new Blob([data],{type:type||'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
const DL={save:async({filename,data})=>saveFile(filename,data,filename.endsWith('.svg')?'image/svg+xml':undefined)};
function stopAll(){Object.keys(unsub).forEach(k=>{try{unsub[k]&&unsub[k]();}catch(e){}delete unsub[k];});}
function onErr(e){if(e&&e.code&&e.code!=='permission-denied')console.warn(e);}
let subKey='';
function subData(){
  const admin=(S.equipo.admins||[]).includes(me);
  const pids=admin?[]:((((S.equipo.miembros||{})[me]||{}).pacientes)||[]).slice().sort();
  const key=(admin?'A':'M')+'|'+now().fecha+'|'+pids.join(',');
  if(key===subKey) return; subKey=key;
  Object.keys(unsub).filter(k=>k!=='e'&&k!=='mine').forEach(k=>{try{unsub[k]();}catch(e){}delete unsub[k];});
  S.fecha=now().fecha;S.pacientes={};S.dias={};S.consultas=[];S.loaded.p=false;S.loaded.d=false;
  if(admin){
    unsub.p=db.collection('pacientes').onSnapshot(q=>{const o={};q.docs.forEach(x=>{o[x.id]=x.data();});S.pacientes=o;S.loaded.p=true;render();handleIntent();},onErr);
    unsub.dias=db.collection('dias').where('fecha','==',S.fecha).onSnapshot(q=>{const o={};q.docs.forEach(x=>{const v=x.data();if(v&&v.pid)o[v.pid]=v;});S.dias=o;S.loaded.d=true;render();handleIntent();},onErr);
    unsub.c=db.collection('consultas').orderBy('ts','desc').limit(200).onSnapshot(q=>{S.consultas=q.docs.map(x=>Object.assign({id:x.id},x.data()));render();},onErr);
    unsub.s=db.collection('solicitudes').onSnapshot(q=>{S.solicitudes=q.docs.map(x=>Object.assign({id:x.id},x.data()));render();},onErr);
    return;
  }
  if(!pids.length){S.loaded.p=true;S.loaded.d=true;render();return;}
  const fp=new Set(),fd=new Set(),cq={};
  pids.forEach(pid=>{
    const okP=()=>{fp.add(pid);if(fp.size>=pids.length)S.loaded.p=true;render();handleIntent();};
    const okD=()=>{fd.add(pid);if(fd.size>=pids.length)S.loaded.d=true;render();handleIntent();};
    unsub['p_'+pid]=db.doc('pacientes/'+pid).onSnapshot(s=>{if(s.exists)S.pacientes[pid]=s.data();else delete S.pacientes[pid];okP();},okP);
    unsub['d_'+pid]=db.doc('dias/'+pid+'_'+S.fecha).onSnapshot(s=>{if(s.exists)S.dias[pid]=s.data();else delete S.dias[pid];okD();},okD);
    unsub['c_'+pid]=db.collection('consultas').where('pid','==',pid).onSnapshot(q=>{cq[pid]=q.docs.map(x=>Object.assign({id:x.id},x.data()));S.consultas=[].concat(...Object.values(cq)).sort((a,b)=>(b.ts||0)-(a.ts||0));render();},onErr);
  });
}
function subMine(){if(unsub.mine||!me)return;unsub.mine=db.doc('solicitudes/'+me).onSnapshot(s=>{S.solicitudes=s.exists?[Object.assign({id:me},s.data())]:[];render();},()=>{});}
function subEquipo(u){
  if(unsub.e){try{unsub.e();}catch(e){}}
  unsub.e=db.doc('config/equipo').onSnapshot(s=>{
    if(!s.exists){
      if(!ui.bootTried){ui.bootTried=true;db.doc('config/equipo').set({admins:[me],adminInfo:{[me]:{nombre:u.email||'Coordinación'}},miembros:{}}).catch(err=>{ui.fatal='fb:'+((err&&err.code)||'create');render();});}
      return;
    }
    S.equipo=s.data()||{};if(!S.equipo.miembros)S.equipo.miembros={};S.loaded.e=true;
    ui.noAccess=!rol();
    if(ui.noAccess){S.loaded.p=true;subMine();render();return;}
    if(unsub.mine){unsub.mine();delete unsub.mine;}
    subData();render();handleIntent();
  },err=>{
    const c=err&&err.code;
    if(c&&c!=='permission-denied'){ui.fatal='fb:'+c;render();return;}
    ui.noAccess=true;S.loaded.e=true;S.loaded.p=true;subMine();render();
    setTimeout(()=>{if(me===u.uid&&ui.noAccess)subEquipo(u);},20000);
  });
}
async function boot(){
  readHash();
  if(typeof firebase==='undefined'){ui.fatal='nodb';render();return;}
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth();
  const fdb=firebase.firestore();
  try{fdb.settings({ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true});}catch(e){}
  db=wrapDb(fdb);dl=DL;
  ui.auth='wait';
  auth.onAuthStateChanged(u=>{
    stopAll();subKey='';ui.bootTried=false;
    S.equipo={miembros:{}};S.pacientes={};S.dias={};S.consultas=[];S.solicitudes=[];S.loaded={e:false,p:false,d:false};ui.noAccess=false;ui.view=null;ui.sheet=null;renderSheet();
    if(!u){me=null;who=null;ui.auth='login';render();return;}
    me=u.uid;who=me;ui.email=u.email;ui.auth=null;
    app.innerHTML='<div class="panel center"><h2>Cargando CuidaCasa…</h2><p class="note">Conectando con los datos del equipo.</p><button class="btn ghost" data-act="signout">Salir</button></div>';
    subEquipo(u);
    const uidNow=u.uid;setTimeout(()=>{if(me===uidNow&&!S.loaded.e&&!ui.noAccess&&!ui.fatal){ui.fatal='timeout';render();}},15000);
  });
  setInterval(()=>{if(me&&S.loaded.e&&!ui.noAccess&&now().fecha!==S.fecha)subData();else if(!ui.sheet&&document.activeElement&&!document.activeElement.matches('input,textarea,select'))render();},30000);
}
boot();
})();
</script>
